<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My trips{% endblock %} · FrontRunner Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #6b7079; --faint: #9aa0a8; --line: #e7e9ed;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); --chip: #eef0f3;
      /* One accent, used sparingly: the main button and small highlights */
      --accent: #2447c7; --accent-soft: #eaf0ff; --on-accent: #fff; --danger: #c0352b;
      /* "leaving soon" and "tight transfer" are different warnings, so they get different colors */
      --soon: #d0342c; --soon-soft: #fdecea; --on-soon: #fff;
      --tight: #9a5b00; --tight-soft: #fff4d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9ba1ab; --faint: #6c727c; --line: #262a32;
        --shadow: 0 1px 2px rgba(0,0,0,.4); --chip: #242831;
        --accent: #7c9cff; --accent-soft: #1b2442; --on-accent: #0f1115; --danger: #ff8a80;
        --soon: #ff6b61; --soon-soft: #3a1714; --on-soon: #1a0906;
        --tight: #f5b942; --tight-soft: #33270c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 56px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 20px; }
    header h1 { margin: 0; }
    h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
      margin: 32px 0 10px; }
    p { margin: 0 0 8px; }
    a { color: var(--text); }
    .back, .edit { text-decoration: none; font-weight: 500; font-size: 15px; color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; color: var(--text); text-decoration: none; }
    .card.collapsed { display: flex; justify-content: space-between; align-items: center; font-weight: 500;
      padding: 16px 18px; }
    .card.collapsed .muted { color: var(--faint); }
    a.card.now { cursor: pointer; }

    /* The answer: leave → arrive, big, each with a small label above */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .top .label { margin: 0; }
    .times { display: flex; align-items: flex-end; gap: 10px; }
    .times > div { min-width: 0; }
    .times .tl { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 2px; line-height: 1.3; }
    .times .big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 0;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .times .ampm { font-size: 16px; font-weight: 600; margin-left: 2px; }
    .times .arrow { color: var(--faint); font-size: 22px; line-height: 1.4; }
    .sentence { font-size: 18px; line-height: 1.4; margin: 0; }
    /* Countdown: accent normally, warning color when it's close */
    .pill { flex: none; font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
      background: var(--accent); color: var(--on-accent); white-space: nowrap; }
    .pill.soon { background: var(--soon); color: var(--on-soon); }

    /* Leaving too soon: warning + backup */
    .rush .times .big { font-size: 22px; color: var(--muted); }
    .rush-note { color: var(--soon); background: var(--soon-soft); font-weight: 600; font-size: 14px;
      padding: 8px 12px; border-radius: 10px; margin: 12px 0 0; }
    .backup { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin: 0 0 6px; }

    /* Tight transfer */
    .tight-note { color: var(--tight); background: var(--tight-soft); font-weight: 600; font-size: 14px;
      padding: 8px 12px; border-radius: 10px; margin: 14px 0 0; }

    /* Route timeline: one row per ride or transfer, joined by a thin vertical line */
    .timeline { list-style: none; padding: 0; margin: 20px 0 0; font-size: 15px; }
    .timeline li { position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; }
    .timeline li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0;
      width: 2px; background: var(--line); }
    .timeline .icon { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); }
    .timeline .icon svg { width: 16px; height: 16px; fill: currentColor; }
    .timeline li > span:last-child { padding-top: 3px; font-variant-numeric: tabular-nums; }
    .timeline b { font-weight: 600; }
    .timeline .nb { white-space: nowrap; }
    .timeline .toward { color: var(--muted); }
    .timeline li.transfer { color: var(--muted); }
    .timeline li.transfer .icon { background: var(--chip); color: var(--muted); }
    .timeline li.tight > span:last-child { color: var(--tight); font-weight: 600; }
    .timeline li.tight .icon { background: var(--tight-soft); color: var(--tight); }
    .total { font-size: 14px; color: var(--muted); margin: 0; }

    /* One-line options, tap to expand */
    details.line { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 8px; padding: 0 14px; font-size: 15px; }
    details.line summary { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0;
      cursor: pointer; list-style: none; font-variant-numeric: tabular-nums; }
    details.line summary::-webkit-details-marker { display: none; }
    details.line summary b { font-weight: 600; }
    details.line summary span { color: var(--muted); }
    details.line[open] { padding-bottom: 8px; }
    details summary { cursor: pointer; }
    .card details > summary { color: var(--muted); font-size: 14px; font-weight: 500; margin-top: 12px; }
    details.earlier > summary { color: var(--muted); font-size: 14px; margin: 28px 0 10px; }

    /* Arrive-by, deliberately small */
    details.arrive { font-size: 15px; margin: 4px 0 0; }
    details.arrive > summary { color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 0; }
    details.arrive form { margin: 8px 0 12px; }
    details.arrive p { margin-top: 8px; }

    .btn { display: inline-block; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--on-accent); text-decoration: none; cursor: pointer; }
    .btn.small { padding: 7px 14px; font-size: 14px; }
    .btn.wide { display: block; text-align: center; margin-top: 28px; }
    .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    .saved { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 15px;
      padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; }
    .note { font-size: 14px; color: var(--muted); margin: 4px 0 20px; }
    .summary { font-size: 15px; color: var(--muted); margin: -12px 0 16px; }
    .choice { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 8px 0; }
    .choice input[type=radio] { width: auto; margin: 0; accent-color: var(--accent); }
    .choice input[type=time], .choice input[type=date] { width: auto; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend { font-weight: 600; font-size: 14px; margin: 18px 0 4px; padding: 0; }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline label { margin: 0; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
    input, select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    form.inline input { width: auto; padding: 6px 8px; }
    .error { background: var(--soon-soft); color: var(--danger); font-weight: 500; padding: 12px 14px;
      border-radius: 12px; margin-bottom: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Keep countdowns current. Reload when the answer should change:
    // the main option drops under {{ RUSH }} min (show a backup), or a "may not make it" option leaves.
    const SOON = {{ SOON }} * 60000, RUSH = {{ RUSH }} * 60000;
    // Use the server's clock, so a phone whose clock is off agrees with what the server showed
    const offset = {{ server_ms() }} - Date.now();
    let reloading = false;
    const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
    function words(left) {
      const m = Math.floor(left / 60000);
      return m < 1 ? "leaving now" : m < 60 ? `leaves in ${m} min` : `leaves in ${Math.floor(m / 60)} h ${m % 60} min`;
    }
    function tick() {
      const now = Date.now() + offset;
      document.querySelectorAll(".pill[data-t]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (el.hasAttribute("data-watch") && left < RUSH) return reload();
        el.textContent = left < 0 ? "left" : words(left);
        el.classList.toggle("soon", left >= 0 && left <= SOON);
      });
      document.querySelectorAll("[data-rush]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (left < 0) return reload();
        const w = words(left);
        el.textContent = w[0].toUpperCase() + w.slice(1) + ", you may not make it";
      });
    }
    tick();
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
