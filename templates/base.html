<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My trips{% endblock %} · FrontRunner Tool</title>
  <style>
    :root {
      --bg: #f6f6f8; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b73; --line: #e3e3e8;
      --accent: #8a1f84; --accent-soft: #f6e7f5; --danger: #b3261e;
      /* "leaving soon" and "tight transfer" are different warnings, so they get different colors */
      --soon: #c62828; --soon-soft: #fdecea;
      --tight: #92400e; --tight-soft: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114; --card: #1c1c21; --text: #f2f2f5; --muted: #a0a0aa; --line: #2e2e36;
        --accent: #e07ada; --accent-soft: #3a1f39; --danger: #ff8a80;
        --soon: #ff6b6b; --soon-soft: #3d1a1a;
        --tight: #fbbf24; --tight-soft: #3a2a0a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    header h1 { margin: 0; }
    h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 28px 0 8px; }
    p { margin: 0 0 8px; }
    a { color: var(--accent); }
    .back, .edit { text-decoration: none; font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-bottom: 12px; color: var(--text); text-decoration: none; }
    .card.now { border: 2px solid var(--accent); }
    .card.collapsed { display: flex; justify-content: space-between; font-weight: 600; padding: 14px 16px; }
    .trip-name { display: block; font-size: 14px; font-weight: 700; color: var(--accent); text-decoration: none;
      margin-bottom: 8px; }
    .more { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; text-decoration: none; }

    /* The answer sentence and its countdown */
    .answer { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .sentence { font-size: 20px; line-height: 1.35; margin: 0; }
    .pill { flex: none; font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: var(--line); color: var(--text); white-space: nowrap; margin-top: 2px; }
    .pill.soon { background: var(--soon); color: #fff; }
    .pill.quiet { background: var(--accent-soft); color: var(--accent); }

    /* Leaving too soon: warning + backup */
    .rush .sentence { font-size: 17px; color: var(--muted); }
    .rush-note { color: var(--soon); background: var(--soon-soft); font-weight: 700; padding: 8px 10px;
      border-radius: 10px; margin: 8px 0; }
    .backup { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin-bottom: 6px; }

    /* Tight transfer */
    .tight-note { color: var(--tight); background: var(--tight-soft); font-weight: 600; font-size: 15px;
      padding: 6px 10px; border-radius: 10px; margin: 10px 0 0; }

    /* Step-by-step directions */
    .steps { list-style: none; padding: 0; margin: 14px 0 6px; font-size: 16px; }
    .steps li { display: flex; gap: 10px; padding: 5px 0; }
    .steps .t { width: 72px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
    .steps li.walk { color: var(--muted); }
    .steps li.walk.tight span:last-child { color: var(--tight); background: var(--tight-soft); font-weight: 600;
      padding: 2px 8px; border-radius: 8px; }

    /* One-line options, tap to expand */
    details.line { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 6px; padding: 0 14px; }
    details.line summary { padding: 12px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
    details.line[open] { padding-bottom: 8px; }
    details summary { cursor: pointer; }
    details.earlier > summary { color: var(--muted); margin: 24px 0 8px; }

    /* Arrive-by, deliberately small */
    details.arrive { font-size: 15px; margin: 4px 0 0; }
    details.arrive > summary { color: var(--accent); font-weight: 600; padding: 6px 0; }
    details.arrive form { margin: 8px 0 12px; }
    details.arrive p { margin-top: 8px; }

    .btn { display: inline-block; border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600;
      background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
    .btn.small { padding: 6px 12px; font-size: 15px; }
    .btn.wide { display: block; text-align: center; margin-top: 20px; }
    .saved { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 10px 12px;
      border-radius: 10px; margin-bottom: 12px; }
    .note { font-size: 14px; color: var(--muted); margin: 4px 0 16px; }
    .choice { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 8px 0; }
    .choice input[type=radio] { width: auto; margin: 0; }
    .choice input[type=time], .choice input[type=date] { width: auto; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend { font-weight: 600; margin: 14px 0 2px; padding: 0; }
    .summary { font-size: 15px; color: var(--muted); margin-bottom: 12px; }
    .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    @media (prefers-color-scheme: dark) { .btn:not(.secondary):not(.danger) { color: #111; } }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline label { margin: 0; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, select { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); }
    form.inline input { width: auto; padding: 6px 8px; }
    .error { background: var(--card); border: 1px solid var(--danger); color: var(--danger); padding: 12px;
      border-radius: 10px; margin-bottom: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Keep countdowns current. Reload when the answer should change:
    // the main option drops under {{ RUSH }} min (show a backup), or a "may not make it" option leaves.
    const SOON = {{ SOON }} * 60000, RUSH = {{ RUSH }} * 60000;
    // Use the server's clock, so a phone whose clock is off agrees with what the server showed
    const offset = {{ server_ms() }} - Date.now();
    let reloading = false;
    const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
    function words(left) {
      const m = Math.floor(left / 60000);
      return m < 1 ? "leaving now" : m < 60 ? `leaves in ${m} min` : `leaves in ${Math.floor(m / 60)} h ${m % 60} min`;
    }
    function tick() {
      const now = Date.now() + offset;
      document.querySelectorAll(".pill[data-t]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (el.hasAttribute("data-watch") && left < RUSH) return reload();
        el.textContent = left < 0 ? "left" : words(left);
        el.classList.toggle("soon", left >= 0 && left <= SOON);
      });
      document.querySelectorAll("[data-rush]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (left < 0) return reload();
        const w = words(left);
        el.textContent = w[0].toUpperCase() + w.slice(1) + ", you may not make it";
      });
    }
    tick();
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
