<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My trips{% endblock %} · Catch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D6ECFF'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%231A86EC'/%3E%3C/svg%3E">
  <style>
    :root {
      /* Frost: icy page, frosted-glass cards, baby-blue accent */
      --bg: #EEF5FC; --glow-1: #CFE7FF; --glow-2: #E4F1FF; --glow-3: #D9ECFB;
      --card: rgba(255,255,255,.74); --card-solid: #FFFFFF; --field: #FFFFFF; --inset: rgba(234,244,255,.8);
      --text: #0B1B2B; --muted: #56687A; --faint: #9AB0C4;
      --line: rgba(15,50,90,.08); --border: rgba(15,50,90,.07); --field-line: #C9D8E6; --rim: rgba(255,255,255,.95);
      /* Layered shadow: a hairline, a contact shadow, then a soft blue drop far below */
      --shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(15,50,90,.06), 0 10px 24px -8px rgba(26,110,200,.16),
        0 32px 64px -32px rgba(26,110,200,.28), inset 0 1px 0 var(--rim);
      --shadow-hover: 0 0 0 1px rgba(26,134,236,.18), 0 2px 4px rgba(15,50,90,.06), 0 16px 32px -10px rgba(26,110,200,.24),
        0 44px 80px -36px rgba(26,110,200,.36), inset 0 1px 0 var(--rim);
      --accent: #0B6FD0; --accent-hover: #075BAE; --ice: #8CCBFF; --accent-soft: #E1F0FF; --on-accent: #FFFFFF;
      --btn-top: #2B93F0; --btn-bottom: #0B6BCB; --danger: #C62828;
      /* "leaving soon" and "tight transfer" are different warnings, so they get different colors */
      --soon: #B42318; --soon-soft: #FEEEEC;
      --tight: #7A4A00; --tight-soft: rgba(255,240,208,.9);
      --radius: 18px; --radius-sm: 12px;
      --display: "Bricolage Grotesque", "Instrument Sans", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07111C; --glow-1: #0E2A48; --glow-2: #0A1E33; --glow-3: #10304F;
        --card: rgba(20,36,56,.62); --card-solid: #122235; --field: #0F1D2D; --inset: rgba(30,56,86,.55);
        --text: #EAF3FC; --muted: #9DB2C7; --faint: #5E7690;
        --line: rgba(160,200,240,.1); --border: rgba(160,200,240,.1); --field-line: #2A4058; --rim: rgba(255,255,255,.06);
        --shadow: 0 0 0 1px var(--border), 0 12px 32px -12px rgba(0,0,0,.6), inset 0 1px 0 var(--rim);
        --shadow-hover: 0 0 0 1px rgba(124,196,255,.3), 0 18px 40px -12px rgba(0,0,0,.7), inset 0 1px 0 var(--rim);
        --accent: #7CC4FF; --accent-hover: #A8D8FF; --ice: #7CC4FF; --accent-soft: rgba(124,196,255,.14); --on-accent: #06121E;
        --btn-top: #9AD2FF; --btn-bottom: #5DB3F7; --danger: #F97066;
        --soon: #FF8A7A; --soon-soft: rgba(255,120,100,.14);
        --tight: #F5B942; --tight-soft: rgba(245,185,66,.12);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; background: transparent; color: var(--text); -webkit-font-smoothing: antialiased;
      font: 16px/1.45 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; position: relative; }
    /* Frosty light behind everything: soft blue glows that drift slowly */
    body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
      background:
        radial-gradient(40% 35% at 15% 10%, var(--glow-1), transparent 70%),
        radial-gradient(35% 30% at 90% 25%, var(--glow-3), transparent 70%),
        radial-gradient(45% 40% at 60% 95%, var(--glow-2), transparent 70%);
      animation: drift 28s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate3d(3%, -2%, 0) rotate(4deg) scale(1.05); } }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }

    /* Top bar: frosted glass that stays put while you scroll */
    .bar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.55);
      -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid var(--line); }
    @media (prefers-color-scheme: dark) { .bar { background: rgba(7,17,28,.55); } }
    .bar-in { max-width: 560px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-family: var(--display); font-weight: 800;
      font-size: 25px; letter-spacing: -.045em; color: var(--text); text-decoration: none; }
    .brand:hover { color: var(--text); }
    /* Signal light: a blue dot with a slow pulse */
    .signal { position: relative; width: 12px; height: 12px; border-radius: 50%; background: #1A86EC;
      box-shadow: 0 0 0 4px var(--accent-soft), 0 0 14px rgba(26,134,236,.55); }
    .signal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #1A86EC;
      animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar-link { font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 0; }

    main { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px; }
    main > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -8px 0 16px; }
    .eyebrow { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0; }
    h1 { font-family: var(--display); font-size: 36px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; margin: 0 0 24px; }
    h1.page-title { margin-top: 0; }
    .eyebrow + h1.page-title { margin-top: 2px; }
    h1.trip-name { margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
    h2 { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.03em; margin: 32px 0 12px; }
    p { margin: 0 0 8px; }
    .back, .edit { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; padding: 10px 0; }
    .back { color: var(--muted); font-weight: 500; }
    .back svg { transition: transform .2s; }
    .back:hover { color: var(--text); }
    .back:hover svg { transform: translateX(-3px); }
    .edit { font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    /* Every card: frosted glass, lit from above, floating on a soft blue shadow */
    .card, .panels .panel, .panels > .rush, .panels > .backup {
      display: block; background: var(--card); border: 0; border-radius: var(--radius); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
      padding: 20px; margin: 0 0 16px; color: var(--text); text-decoration: none; }
    a.card { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
    a.card:hover { color: var(--text); transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    a.card:active { transform: translateY(-1px) scale(.995); }
    /* The next trip gets a brighter, icier glass so it reads as the main thing on the page */
    .panels > .panel:first-child, .panels > .rush {
      background: linear-gradient(165deg, rgba(255,255,255,.92), rgba(222,239,255,.78)); }
    @media (prefers-color-scheme: dark) {
      .panels > .panel:first-child, .panels > .rush { background: linear-gradient(165deg, rgba(30,56,86,.75), rgba(16,32,52,.7)); }
    }
    /* Cards drift up into place on load, one after another */
    .card, .panels > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .card:nth-of-type(2), .panels > :nth-child(2) { animation-delay: .07s; }
    .card:nth-of-type(3), .panels > :nth-child(3) { animation-delay: .14s; }
    .card:nth-of-type(n+4), .panels > :nth-child(n+4) { animation-delay: .2s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .route { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* Row above the times: title on the left, countdown on the right */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .top .label { margin: 0; }
    .label { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
    /* On My trips the title is the trip's name */
    a.card .top .label { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
    a.card .backup .top .label { font-size: 15px; font-weight: 600; color: var(--muted); }

    /* Earlier today: just the header until opened */
    .panels summary.top { list-style: none; cursor: pointer; margin: 0; }
    .panels summary.top::-webkit-details-marker { display: none; }
    .panels summary.top::after { content: "Show"; color: var(--accent); font-size: 15px; font-weight: 600; }
    .panels details[open] > summary.top { margin-bottom: 8px; }
    .panels details[open] > summary.top::after { content: "Hide"; }

    /* The answer: leave → arrive, big */
    .times { display: flex; align-items: baseline; gap: 10px; }
    .times .big { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; margin: 0;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .panels .times .big { font-size: 44px; }
    .times .ampm { font-family: "Instrument Sans", sans-serif; font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
    .panels .times .ampm { font-size: 17px; }
    .times .arrow { color: var(--faint); font-size: 22px; transition: transform .25s, color .25s; }
    a.card:hover .times .arrow { transform: translateX(4px); color: var(--accent); }
    .sentence { font-size: 18px; line-height: 1.4; margin: 0; }
    /* Countdown: a live dot that pulses, blue normally, red when it's close */
    .pill { flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); background: var(--accent-soft);
      padding: 6px 12px 6px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(26,134,236,.14); }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor;
      box-shadow: 0 0 0 0 currentColor; animation: live 2s ease-out infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(26,134,236,.45); } 100% { box-shadow: 0 0 0 7px rgba(26,134,236,0); } }
    .pill.soon { color: var(--soon); background: var(--soon-soft); box-shadow: inset 0 0 0 1px rgba(180,35,24,.14); }
    .pill.soon::before { animation-name: live-soon; animation-duration: 1.2s; }
    @keyframes live-soon { 0% { box-shadow: 0 0 0 0 rgba(180,35,24,.45); } 100% { box-shadow: 0 0 0 7px rgba(180,35,24,0); } }

    /* A departure on a later day: the day instead of a countdown, no live dot */
    .pill.day { color: var(--muted); background: var(--inset); box-shadow: inset 0 0 0 1px var(--line); gap: 6px; }
    .pill.day::before { display: none; }

    /* My trips, big card: "If you miss it" as one quiet row under the route */
    .miss { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 14px;
      padding: 10px 12px; border-radius: 12px; background: var(--inset); box-shadow: inset 0 0 0 1px var(--line);
      font-size: 14px; color: var(--muted); }
    .miss b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    /* My trips, compact card: same parts, smaller */
    .trip-card.compact { padding: 16px 20px; }
    .trip-card.compact .top { margin-bottom: 6px; }
    a.card.compact .top .label { font-size: 17px; }
    .line-times { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin: 0;
      font-variant-numeric: tabular-nums; }
    .trip-card.compact .foot { margin-top: 12px; padding-top: 10px; }
    .trip-card .none { margin: 8px 0 0; }
    .after-route { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }

    /* Morning / Evening / Anytime: one segmented control */
    .seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--inset); box-shadow: inset 0 0 0 1px var(--line); }
    .seg label { flex: 1; margin: 0; padding: 10px 8px; min-height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
    .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .seg label:hover { color: var(--text); }
    .seg label:has(input:checked) { background: var(--card-solid); color: var(--accent);
      box-shadow: 0 1px 2px rgba(15,50,90,.1), 0 4px 10px -4px rgba(26,110,200,.25); }
    .seg label:has(input:focus-visible) { outline: 2px solid #1A86EC; outline-offset: 2px; }
    .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    fieldset.usual { margin-top: 18px; }

    /* Leaving too soon: warning + backup */
    .rush .times .big { font-size: 24px; color: var(--muted); }
    .panels .rush .times .big { font-size: 28px; }
    .panels > .rush > .top .label { color: var(--soon); }
    .rush-note { color: var(--soon); font-weight: 600; font-size: 15px; margin: 12px 0 0; }
    .backup { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .panels > .backup { margin-top: 0; }

    /* My trips: modes and total time along the bottom of each card */
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .modes { display: flex; align-items: center; gap: 6px; color: var(--accent); }
    .modes svg { padding: 5px; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(26,134,236,.12); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .modes .sep { color: var(--faint); }
    /* The bus and train roll forward a little when you hover a trip */
    a.card:hover .modes svg { transform: translateX(3px); }
    a.card:hover .modes svg:last-child { transition-delay: .06s; }

    /* Route: a line of stops. Time on the left, a dot on a connecting line, station on the right.
       The line carries a soft light moving along it, like a train heading down the track. */
    .stops { list-style: none; padding: 18px 0 0; margin: 18px 0 0; font-size: 15px; border-top: 1px solid var(--line); }
    .chip-route .stops { border-top: 0; margin-top: 4px; padding-top: 8px; }
    .stops li { position: relative; display: grid; grid-template-columns: 44px 12px 1fr; column-gap: 14px; padding-bottom: 22px; }
    .stops li:last-child { padding-bottom: 0; }
    .stops li:not(:last-child)::before { content: ""; position: absolute; left: 62px; top: 17px; bottom: -5px; width: 4px;
      border-radius: 2px; background: linear-gradient(180deg, var(--ice) 0%, #1A86EC 40%, var(--ice) 80%) 0 0 / 100% 200%;
      animation: flow 3s linear infinite; }
    @keyframes flow { to { background-position: 0 -200%; } }
    .stops .t { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 22px; }
    .stops .dot { position: relative; width: 14px; height: 14px; margin: 4px 0 0 -1px; border-radius: 50%;
      border: 3px solid #1A86EC; background: var(--card-solid); z-index: 1; box-shadow: 0 0 0 3px var(--accent-soft); }
    .stops li:first-child .dot, .stops li:last-child .dot { background: #1A86EC; }
    .stops p { margin: 0; line-height: 22px; }
    .stops .stop { font-weight: 600; }
    .stops .ride { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
    .xfer { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--inset); font-size: 13px; line-height: 1.4;
      box-shadow: inset 0 0 0 1px var(--line); }
    .xfer p { margin: 0; line-height: 1.4; }
    .xfer .ride { margin: 0; }
    .xfer .ride:first-child { color: var(--text); font-weight: 600; }
    .xfer.tight { background: var(--tight-soft); }
    .xfer.tight .ride { color: var(--tight); }
    .total { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* Other times today: one row each, tap to show its stops */
    .chip { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0;
      font: inherit; font-size: 16px; text-align: left; color: var(--text); background: none; border: 0;
      border-top: 1px solid var(--line); cursor: pointer; font-variant-numeric: tabular-nums; }
    .chip b { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.02em;
      transition: color .2s, transform .25s cubic-bezier(.2,.8,.2,1); }
    .chip span { color: var(--muted); font-size: 14px; }
    .chip:hover b { transform: translateX(3px); }
    .chip:hover b, .chip[aria-expanded="true"] b { color: var(--accent); }
    .chip-route { padding: 0 0 16px; }
    .show-all { display: block; width: 100%; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600; color: var(--accent);
      background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0 0; cursor: pointer; }
    .panels .panel:has(.chips) { padding-bottom: 8px; }
    .panels details.panel:not([open]) { padding-bottom: 20px; }

    /* One-line options, tap to expand */
    details.line { background: var(--card); border-radius: var(--radius-sm); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 0 16px; margin-bottom: 10px; font-size: 16px; }
    details.line summary { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0;
      cursor: pointer; list-style: none; font-variant-numeric: tabular-nums; }
    details.line summary::-webkit-details-marker { display: none; }
    details.line summary b { font-weight: 600; }
    details.line summary span { color: var(--muted); }
    details.line .stops { margin-top: 0; }
    details.line[open] { padding-bottom: 16px; }
    details summary { cursor: pointer; }
    .card details > summary, .rush details > summary { color: var(--accent); font-size: 15px; font-weight: 500; margin-top: 14px; }

    /* Arrive-by, deliberately small */
    details.arrive { font-size: 15px; margin: 8px 0 0; text-align: center; }
    details.arrive > summary { display: inline-block; color: var(--accent); font-weight: 500; font-size: 15px; padding: 10px; }
    details.arrive[open] { text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 8px 20px 16px; }
    details.arrive[open] > summary { padding-left: 0; }
    details.arrive form { margin: 8px 0 12px; }
    details.arrive p { margin-top: 8px; }

    /* Buttons: glossy blue, lit from the top, lifting on hover */
    .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0;
      border-radius: 999px; padding: 13px 22px; font: inherit; font-weight: 600; color: var(--on-accent); text-decoration: none; cursor: pointer;
      background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(11,80,160,.3), 0 10px 24px -8px rgba(26,134,236,.55);
      transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s, filter .2s; }
    .btn:hover { color: var(--on-accent); transform: translateY(-2px); filter: brightness(1.05);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 4px rgba(11,80,160,.3), 0 16px 32px -10px rgba(26,134,236,.6); }
    .btn:active { transform: translateY(0); }
    .btn svg { transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .btn:hover svg { transform: rotate(90deg); }
    .btn.small { padding: 8px 16px; font-size: 15px; }
    .btn.wide { display: flex; width: 100%; margin-top: 24px; }
    .btn.cta { min-height: 54px; font-size: 16px; margin-top: 12px; }
    .btn.secondary, .btn.danger { background: var(--card); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      box-shadow: var(--shadow); color: var(--text); }
    .btn.secondary:hover { color: var(--text); box-shadow: var(--shadow-hover); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { color: var(--danger); box-shadow: var(--shadow-hover); }
    .saved { color: var(--accent); background: var(--accent-soft); font-weight: 600; font-size: 15px;
      padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; }
    .note { font-size: 15px; color: var(--muted); margin: -12px 0 20px; }
    .summary { font-size: 15px; color: var(--muted); margin: -16px 0 20px; }
    .choice { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 8px 0; }
    .choice input[type=radio] { width: auto; margin: 0; accent-color: #1A86EC; }
    .choice input[type=time], .choice input[type=date] { width: auto; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 20px 0 0; }
    legend { font-weight: 600; font-size: 15px; margin: 0; padding: 0 0 6px; }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline label { margin: 0; }
    form.card label:first-child { margin-top: 0; }
    label { display: block; font-weight: 600; font-size: 15px; margin: 18px 0 8px; }
    input, select { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--field-line);
      background: var(--field); color: var(--text); box-shadow: inset 0 1px 2px rgba(15,50,90,.06); transition: border-color .2s, box-shadow .2s; }
    input:focus, select:focus { outline: 0; border-color: #1A86EC; box-shadow: 0 0 0 4px rgba(26,134,236,.18); }
    form.inline input { width: auto; padding: 6px 8px; }
    .error { color: var(--danger); background: var(--soon-soft); font-weight: 600; padding: 12px 16px;
      border-radius: var(--radius-sm); margin-bottom: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }

    /* Anyone who asks their device for less motion gets a still page */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="signal" aria-hidden="true"></span>
        Catch
      </a>
      <a class="bar-link" href="{{ url_for('plan_trip') }}">Plan a trip</a>
    </div>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Keep countdowns current. Reload when the answer should change:
    // the main option drops under {{ RUSH }} min (show a backup), or a "may not make it" option leaves.
    const SOON = {{ SOON }} * 60000, RUSH = {{ RUSH }} * 60000;
    // Use the server's clock, so a phone whose clock is off agrees with what the server showed
    const offset = {{ server_ms() }} - Date.now();
    let reloading = false;
    const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
    function words(left) {
      const m = Math.floor(left / 60000);
      return m < 1 ? "leaving now" : m < 60 ? `leaves in ${m} min` : `leaves in ${Math.floor(m / 60)} h ${m % 60} min`;
    }
    function tick() {
      const now = Date.now() + offset;
      document.querySelectorAll(".pill[data-t]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (el.hasAttribute("data-watch") && left < RUSH) return reload();
        if (el.hasAttribute("data-refresh") && left < 0) return reload();
        el.textContent = el.dataset.what + " " + (left < 0 ? "left" : words(left));
        el.classList.toggle("soon", left >= 0 && left <= SOON);
      });
      document.querySelectorAll("[data-rush]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (left < 0) return reload();
        const w = words(left);
        el.textContent = w[0].toUpperCase() + w.slice(1) + ", you may not make it";
      });
    }
    tick();
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
