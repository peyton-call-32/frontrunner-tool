<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My trips{% endblock %} · FrontRunner Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette: blue #1565c0, red #c62828, white #ffffff, gray #999999, near-black #252525.
         Cards, lines and soft tints are light shades of these. */
      --bg: #ffffff; --card: #f4f4f4; --field: #ffffff; --text: #252525; --muted: #6e6e6e; --faint: #999999;
      --line: #e5e5e5; --field-line: #cccccc; --shadow: none; --chip: #e9e9e9;
      /* One accent, used sparingly: the main button and small highlights */
      --accent: #1565c0; --accent-soft: #e6eef9; --on-accent: #fff; --danger: #c62828;
      /* "leaving soon" and "tight transfer" are different warnings, so they get different colors */
      --soon: #c62828; --soon-soft: #fbe9e9; --on-soon: #fff;
      --tight: #9a5b00; --tight-soft: #fff4d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a; --card: #252525; --field: #333333; --text: #ffffff; --muted: #999999; --faint: #6e6e6e;
        --line: #333333; --field-line: #4a4a4a; --shadow: none; --chip: #333333;
        --accent: #5b9be6; --accent-soft: #16263b; --on-accent: #1a1a1a; --danger: #ef6b6b;
        --soon: #ef6b6b; --soon-soft: #3a1818; --on-soon: #1a1a1a;
        --tight: #f5b942; --tight-soft: #33270c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      font: 16px/1.45 Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 36px 20px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    h1 { font-size: 30px; font-weight: 500; letter-spacing: -.01em; line-height: 1.2; margin: 0 0 28px; }
    header h1 { margin: 0; }
    h1.trip-name { font-weight: 600; }
    h2 { font-size: 20px; font-weight: 500; letter-spacing: -.01em; margin: 40px 0 16px; }
    p { margin: 0 0 8px; }
    a { color: var(--text); }
    .back, .edit { text-decoration: none; font-weight: 400; font-size: 15px; color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    /* Flat sections split by thin lines, not rounded boxes */
    .card { display: block; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      color: var(--text); text-decoration: none; }
    .card + .card { border-top: 0; }
    form.card { border: 0; padding: 0; }
    a.card.now { cursor: pointer; }
    /* Trip name on home page cards: bigger, dark, normal case so it reads at a glance */
    a.card.now .top .label { font-size: 18px; font-weight: 600; color: var(--text); }
    /* My trips: each saved trip in its own light box */
    .card.box { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card.box + .card.box { border-top: 1px solid var(--line); }
    .route { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* The answer: leave → arrive, big */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .top .label { margin: 0; }
    .times { display: flex; align-items: center; gap: 10px; }
    .times .big { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 0;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .times .ampm { font-size: 16px; font-weight: 700; margin-left: 2px; }
    .times .arrow { color: var(--faint); font-size: 22px; }
    .sentence { font-size: 18px; line-height: 1.4; margin: 0; }
    /* Countdown: accent normally, warning color when it's close */
    .pill { flex: none; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--accent); white-space: nowrap; }
    .pill.soon { color: var(--soon); }

    /* Leaving too soon: warning + backup */
    .rush .times .big { font-size: 22px; color: var(--muted); }
    .rush-note { color: var(--soon); font-weight: 700; font-size: 15px; margin: 12px 0 0; }
    .backup { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .label { font-size: 15px; font-weight: 400; color: var(--muted); margin: 0 0 6px; }

    /* Tight transfer */
    .tight-note { color: var(--tight); font-weight: 700; font-size: 15px; margin: 14px 0 0; }

    /* Route: a line of stops. Time on the left, a dot on a connecting line, station on the right */
    .stops { list-style: none; padding: 0; margin: 20px 0 0; font-size: 15px; }
    .stops li { position: relative; display: grid; grid-template-columns: 44px 12px 1fr; column-gap: 12px;
      padding-bottom: 18px; }
    .stops li:last-child { padding-bottom: 0; }
    .stops li:not(:last-child)::before { content: ""; position: absolute; left: 61px; top: 12px; bottom: -6px;
      width: 2px; background: var(--accent); opacity: .35; }
    .stops .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.5; }
    .stops .dot { position: relative; width: 12px; height: 12px; margin-top: 5px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--bg); }
    .stops li:first-child .dot, .stops li:last-child .dot { background: var(--accent); }
    .stops p { margin: 0; line-height: 1.5; }
    .stops .stop { font-weight: 600; }
    .stops .ride { color: var(--muted); font-size: 14px; }
    .stops .ride.tight { color: var(--tight); font-weight: 600; }
    .total { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* Other times today: small side-by-side buttons */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font: inherit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 12px;
      border: 1px solid var(--field-line); border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; }
    .chip[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .chip-route { padding: 4px 0 8px; }
    .show-all { font: inherit; font-size: 15px; font-weight: 500; color: var(--accent); background: none; border: 0;
      padding: 10px 0 0; cursor: pointer; }

    /* One-line options, tap to expand */
    details.line { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 16px; }
    details.line + details.line { border-top: 0; }
    details.line summary { display: flex; justify-content: space-between; gap: 12px; padding: 16px 0;
      cursor: pointer; list-style: none; font-variant-numeric: tabular-nums; }
    details.line summary::-webkit-details-marker { display: none; }
    details.line summary b { font-weight: 700; }
    details.line summary span { color: var(--muted); }
    details.line[open] { padding-bottom: 8px; }
    details summary { cursor: pointer; }
    .card details > summary { color: var(--muted); font-size: 15px; font-weight: 400; margin-top: 14px; }
    details.earlier > summary { color: var(--muted); font-size: 15px; margin: 32px 0 12px; }

    /* Arrive-by, deliberately small */
    details.arrive { font-size: 15px; margin: 32px 0 0; }
    details.arrive > summary { color: var(--accent); font-weight: 500; font-size: 15px; padding: 6px 0; }
    details.arrive form { margin: 8px 0 12px; }
    details.arrive p { margin-top: 8px; }

    .btn { display: inline-block; border: 1px solid transparent; border-radius: 4px; padding: 14px 20px; font: inherit; font-weight: 500;
      background: var(--accent); color: var(--on-accent); text-decoration: none; cursor: pointer; }
    .btn.small { padding: 8px 16px; font-size: 15px; }
    .btn.wide { display: block; text-align: center; margin-top: 32px; }
    .btn.secondary { background: transparent; color: var(--text); border-color: var(--field-line); }
    .btn.danger { background: transparent; color: var(--danger); border-color: var(--field-line); }
    .saved { color: var(--accent); font-weight: 700; font-size: 15px; margin-bottom: 20px; }
    .note { font-size: 15px; color: var(--muted); margin: 4px 0 24px; }
    .summary { font-size: 15px; color: var(--muted); margin: -12px 0 16px; }
    .choice { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 8px 0; }
    .choice input[type=radio] { width: auto; margin: 0; accent-color: var(--accent); }
    .choice input[type=time], .choice input[type=date] { width: auto; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 20px 0 0; }
    legend { font-weight: 500; font-size: 15px; margin: 0; padding: 0 0 6px; }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline label { margin: 0; }
    label { display: block; font-weight: 500; font-size: 15px; margin: 18px 0 8px; }
    input, select { font: inherit; width: 100%; padding: 12px 14px; border-radius: 4px; border: 1px solid var(--field-line);
      background: var(--field); color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    form.inline input { width: auto; padding: 6px 8px; }
    .error { color: var(--danger); font-weight: 700; margin-bottom: 20px; }
    .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Keep countdowns current. Reload when the answer should change:
    // the main option drops under {{ RUSH }} min (show a backup), or a "may not make it" option leaves.
    const SOON = {{ SOON }} * 60000, RUSH = {{ RUSH }} * 60000;
    // Use the server's clock, so a phone whose clock is off agrees with what the server showed
    const offset = {{ server_ms() }} - Date.now();
    let reloading = false;
    const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
    function words(left) {
      const m = Math.floor(left / 60000);
      return m < 1 ? "leaving now" : m < 60 ? `leaves in ${m} min` : `leaves in ${Math.floor(m / 60)} h ${m % 60} min`;
    }
    function tick() {
      const now = Date.now() + offset;
      document.querySelectorAll(".pill[data-t]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (el.hasAttribute("data-watch") && left < RUSH) return reload();
        el.textContent = el.dataset.what + " " + (left < 0 ? "left" : words(left));
        el.classList.toggle("soon", left >= 0 && left <= SOON);
      });
      document.querySelectorAll("[data-rush]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (left < 0) return reload();
        const w = words(left);
        el.textContent = w[0].toUpperCase() + w.slice(1) + ", you may not make it";
      });
    }
    tick();
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
