<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My trips{% endblock %} · Catch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Cg fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='10' y='7' width='12' height='12' rx='3'/%3E%3Cpath d='M10 13h12M13 25l-2-4M19 25l2-4'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      /* Clean & Calm: light gray page, white cards, one blue accent */
      --bg: #F4F5F7; --card: #FFFFFF; --field: #FFFFFF; --inset: #F5F7FA;
      --text: #0F172A; --muted: #5B6472; --faint: #98A2B3;
      --line: #EEF0F3; --border: #E4E7EC; --field-line: #D0D5DD;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05);
      --accent: #1D4ED8; --accent-hover: #1E40AF; --accent-soft: #EEF3FF; --on-accent: #FFFFFF; --danger: #C62828;
      /* "leaving soon" and "tight transfer" are different warnings, so they get different colors */
      --soon: #B42318; --soon-soft: #FEF0EF;
      --tight: #7A4A00; --tight-soft: #FFF4DB;
      --radius: 16px; --radius-sm: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1115; --card: #181B21; --field: #1F232B; --inset: #1F232B;
        --text: #F2F4F7; --muted: #A3AAB6; --faint: #6B7280;
        --line: #262A33; --border: #2A2F38; --field-line: #3A404B;
        --shadow: none;
        --accent: #7AA2FF; --accent-hover: #9DBBFF; --accent-soft: #1A2542; --on-accent: #0F1115; --danger: #F97066;
        --soon: #F97066; --soon-soft: #3A1A18;
        --tight: #F5B942; --tight-soft: #33270C;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      font: 16px/1.45 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }

    /* Top bar: logo on the left, Plan a trip on the right */
    .bar { background: var(--card); border-bottom: 1px solid var(--border); }
    .bar-in { max-width: 560px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 12px 0; font-weight: 700; font-size: 16px;
      letter-spacing: -.01em; color: var(--text); text-decoration: none; }
    .brand:hover { color: var(--text); }
    .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent);
      display: flex; align-items: center; justify-content: center; }
    .bar-link { font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 0; }

    main { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px; }
    main > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -8px 0 16px; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0; }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; margin: 0 0 24px; }
    h1.page-title { margin-top: 6px; }
    h1.trip-name { margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 24px; }
    h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 32px 0 12px; }
    p { margin: 0 0 8px; }
    .back, .edit { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; padding: 10px 0; }
    .back { color: var(--muted); font-weight: 500; }
    .back:hover { color: var(--text); }
    .edit { font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    /* Every card: white, softly outlined, rounded */
    .card, .panels .panel, .panels > .rush, .panels > .backup {
      display: block; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px; margin: 0 0 16px; color: var(--text); text-decoration: none; }
    a.card { transition: border-color .15s, transform .15s; }
    a.card:hover { color: var(--text); border-color: #C9D2E3; }
    a.card:active { transform: scale(.99); }
    @media (prefers-color-scheme: dark) { a.card:hover { border-color: #3A404B; } }
    .route { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* Row above the times: title on the left, countdown on the right */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .top .label { margin: 0; }
    .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
    /* On My trips the title is the trip's name */
    a.card .top .label { font-size: 17px; font-weight: 600; color: var(--text); text-transform: none; letter-spacing: -.01em; }
    a.card .backup .top .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    /* Earlier today: just the header until opened */
    .panels summary.top { list-style: none; cursor: pointer; margin: 0; }
    .panels summary.top::-webkit-details-marker { display: none; }
    .panels summary.top::after { content: "Show"; color: var(--accent); font-size: 15px; font-weight: 600; }
    .panels details[open] > summary.top { margin-bottom: 8px; }
    .panels details[open] > summary.top::after { content: "Hide"; }

    /* The answer: leave → arrive, big */
    .times { display: flex; align-items: baseline; gap: 10px; }
    .times .big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 0;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .panels .times .big { font-size: 40px; letter-spacing: -.03em; }
    .times .ampm { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
    .panels .times .ampm { font-size: 17px; }
    .times .arrow { color: var(--faint); font-size: 22px; }
    .sentence { font-size: 18px; line-height: 1.4; margin: 0; }
    /* Countdown badge: blue normally, red when it's close */
    .pill { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
      font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); background: var(--accent-soft);
      padding: 5px 10px; border-radius: 999px; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.soon { color: var(--soon); background: var(--soon-soft); }

    /* Leaving too soon: warning + backup */
    .rush .times .big { font-size: 22px; color: var(--muted); }
    .panels .rush .times .big { font-size: 26px; }
    .panels > .rush > .top .label { color: var(--soon); }
    .rush-note { color: var(--soon); font-weight: 600; font-size: 15px; margin: 12px 0 0; }
    .backup { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .panels > .backup { margin-top: 0; }

    /* My trips: modes and total time along the bottom of each card */
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .modes { display: flex; align-items: center; gap: 4px; color: var(--text); }
    .modes .sep { color: var(--faint); }

    /* Route: a line of stops. Time on the left, a dot on a connecting line, station on the right */
    .stops { list-style: none; padding: 18px 0 0; margin: 18px 0 0; font-size: 15px; border-top: 1px solid var(--line); }
    .chip-route .stops { border-top: 0; margin-top: 4px; padding-top: 8px; }
    .stops li { position: relative; display: grid; grid-template-columns: 44px 12px 1fr; column-gap: 14px; padding-bottom: 22px; }
    .stops li:last-child { padding-bottom: 0; }
    .stops li:not(:last-child)::before { content: ""; position: absolute; left: 63px; top: 17px; bottom: -5px;
      width: 2px; background: var(--accent); }
    .stops .t { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 22px; }
    .stops .dot { position: relative; width: 12px; height: 12px; margin-top: 5px; border-radius: 50%;
      border: 2.5px solid var(--accent); background: var(--card); z-index: 1; }
    .stops li:first-child .dot, .stops li:last-child .dot { background: var(--accent); }
    .stops p { margin: 0; line-height: 22px; }
    .stops .stop { font-weight: 600; }
    .stops .ride { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
    .xfer { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--inset); font-size: 13px; line-height: 1.4; }
    .xfer p { margin: 0; line-height: 1.4; }
    .xfer .ride { margin: 0; }
    .xfer .ride:first-child { color: var(--text); font-weight: 600; }
    .xfer.tight { background: var(--tight-soft); }
    .xfer.tight .ride { color: var(--tight); }
    .total { font-size: 14px; color: var(--muted); margin: 4px 0 0; }

    /* Other times today: one row each, tap to show its stops */
    .chip { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0;
      font: inherit; font-size: 16px; text-align: left; color: var(--text); background: none; border: 0;
      border-top: 1px solid var(--line); cursor: pointer; font-variant-numeric: tabular-nums; }
    .chip[hidden] { display: none; }
    .chip b { font-weight: 600; }
    .chip span { color: var(--muted); font-size: 14px; }
    .chip:hover b { color: var(--accent); }
    .chip[aria-expanded="true"] b { color: var(--accent); }
    .chip-route { padding: 0 0 16px; }
    .show-all { display: block; width: 100%; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600; color: var(--accent);
      background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0 0; cursor: pointer; }
    .panels .panel:has(.chips) { padding-bottom: 8px; }

    /* One-line options, tap to expand */
    details.line { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow); padding: 0 16px; margin-bottom: 8px; font-size: 16px; }
    details.line summary { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0;
      cursor: pointer; list-style: none; font-variant-numeric: tabular-nums; }
    details.line summary::-webkit-details-marker { display: none; }
    details.line summary b { font-weight: 600; }
    details.line summary span { color: var(--muted); }
    details.line .stops { margin-top: 0; }
    details.line[open] { padding-bottom: 16px; }
    details summary { cursor: pointer; }
    .card details > summary, .rush details > summary { color: var(--accent); font-size: 15px; font-weight: 500; margin-top: 14px; }

    /* Arrive-by, deliberately small */
    details.arrive { font-size: 15px; margin: 8px 0 0; text-align: center; }
    details.arrive > summary { display: inline-block; color: var(--accent); font-weight: 500; font-size: 15px; padding: 10px; }
    details.arrive[open] { text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 8px 20px 16px; }
    details.arrive[open] > summary { padding-left: 0; }
    details.arrive form { margin: 8px 0 12px; }
    details.arrive p { margin-top: 8px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent;
      border-radius: var(--radius-sm); padding: 13px 20px; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--on-accent); text-decoration: none; cursor: pointer; transition: background .15s; }
    .btn:hover { background: var(--accent-hover); color: var(--on-accent); }
    .btn.small { padding: 8px 16px; font-size: 15px; border-radius: 10px; }
    .btn.wide { display: flex; width: 100%; margin-top: 24px; }
    .btn.cta { min-height: 52px; font-size: 16px; margin-top: 8px; }
    .btn.secondary { background: var(--card); color: var(--text); border-color: var(--field-line); }
    .btn.secondary:hover { background: var(--inset); color: var(--text); }
    .btn.danger { background: transparent; color: var(--danger); border-color: var(--field-line); }
    .btn.danger:hover { background: var(--soon-soft); color: var(--danger); }
    .saved { color: var(--accent); background: var(--accent-soft); font-weight: 600; font-size: 15px;
      padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; }
    .note { font-size: 15px; color: var(--muted); margin: -12px 0 20px; }
    .summary { font-size: 15px; color: var(--muted); margin: -16px 0 20px; }
    .choice { display: flex; align-items: center; gap: 10px; font-weight: 400; margin: 8px 0; }
    .choice input[type=radio] { width: auto; margin: 0; accent-color: var(--accent); }
    .choice input[type=time], .choice input[type=date] { width: auto; padding: 6px 8px; }
    fieldset { border: 0; padding: 0; margin: 20px 0 0; }
    legend { font-weight: 600; font-size: 15px; margin: 0; padding: 0 0 6px; }
    form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline label { margin: 0; }
    form.card label:first-child { margin-top: 0; }
    label { display: block; font-weight: 600; font-size: 15px; margin: 18px 0 8px; }
    input, select { font: inherit; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--field-line);
      background: var(--field); color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    form.inline input { width: auto; padding: 6px 8px; }
    .error { color: var(--danger); background: var(--soon-soft); font-weight: 600; padding: 12px 16px;
      border-radius: var(--radius-sm); margin-bottom: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 21l-2-4M15 21l2-4"/></svg></span>
        Catch
      </a>
      <a class="bar-link" href="{{ url_for('plan_trip') }}">Plan a trip</a>
    </div>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Keep countdowns current. Reload when the answer should change:
    // the main option drops under {{ RUSH }} min (show a backup), or a "may not make it" option leaves.
    const SOON = {{ SOON }} * 60000, RUSH = {{ RUSH }} * 60000;
    // Use the server's clock, so a phone whose clock is off agrees with what the server showed
    const offset = {{ server_ms() }} - Date.now();
    let reloading = false;
    const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
    function words(left) {
      const m = Math.floor(left / 60000);
      return m < 1 ? "leaving now" : m < 60 ? `leaves in ${m} min` : `leaves in ${Math.floor(m / 60)} h ${m % 60} min`;
    }
    function tick() {
      const now = Date.now() + offset;
      document.querySelectorAll(".pill[data-t]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (el.hasAttribute("data-watch") && left < RUSH) return reload();
        el.textContent = el.dataset.what + " " + (left < 0 ? "left" : words(left));
        el.classList.toggle("soon", left >= 0 && left <= SOON);
      });
      document.querySelectorAll("[data-rush]").forEach(el => {
        const left = Number(el.dataset.t) - now;
        if (left < 0) return reload();
        const w = words(left);
        el.textContent = w[0].toUpperCase() + w.slice(1) + ", you may not make it";
      });
    }
    tick();
    setInterval(tick, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
